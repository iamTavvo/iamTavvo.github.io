<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tavvo — video editor for creators.">
  <title>Tavvo — Video Editor</title>

  <style>
    :root {
      --card: #0d1918;
      --card-hover: #10201e;
      --text: #f2fffc;
      --muted: #91aaa5;
      --line: rgba(255,255,255,.09);
      --accent: #00ffd5;
      --accent-soft: rgba(0,255,213,.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      /* Simple top to bottom teal gradient */
      background: linear-gradient(to bottom, #00A3A3, #003D3D);
      background-attachment: fixed;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Scaled up container so content looks naturally larger at 100% zoom */
    .wrap {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
      position: relative;
    }

    /* Header */
    header {
      padding: 32px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      color: #001713;
      font-size: .95rem;
      font-weight: 900;
    }

    /* DM me cube button in top right */
    .top-link {
      color: #ffffff;
      font-size: .92rem;
      font-weight: 700;
      padding: 10px 20px;
      border: 2px solid #ffffff;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      transition: .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .top-link:hover {
      background: #ffffff;
      color: #003D3D;
      transform: translateY(-2px);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 60px 0 60px;
    }

    /* Smaller, clean main slogan */
    .hero h1 {
      max-width: 850px;
      margin: auto;
      font-size: clamp(1.6rem, 3.8vw, 2.4rem);
      line-height: 1.25;
      letter-spacing: -.02em;
      font-weight: 800;
      color: #ffffff;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 50px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: .95rem;
      font-weight: 800;
      transition: .2s ease;
    }

    .btn-main {
      background: var(--accent);
      color: #001713;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,255,213,.25);
    }

    .btn-ghost {
      border: 2px solid #ffffff;
      color: #ffffff;
      background: rgba(255,255,255,.05);
    }

    .btn-ghost:hover {
      background: #ffffff;
      color: #003D3D;
      transform: translateY(-2px);
    }

    /* Sections */
    section {
      padding: 42px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 18px;
      gap: 20px;
    }

    .section-head h2 {
      font-size: 1.65rem;
      letter-spacing: -.03em;
    }

    /* Videos with White Border & Good Rounding */
    .featured {
      border: 2.5px solid #ffffff;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .featured iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      border: 0;
    }

    .featured-label {
      padding: 16px 20px;
      color: var(--text);
      font-size: .9rem;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      border: 2.5px solid #ffffff;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card);
      transition: .2s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }

    .card iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      border: 0;
    }

    .shorts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .short {
      overflow: hidden;
      border: 2.5px solid #ffffff;
      border-radius: 20px;
      background: var(--card);
      transition: .2s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .short:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }

    .short iframe {
      width: 100%;
      aspect-ratio: 9/16;
      display: block;
      border: 0;
    }

    /* CTA */
    .cta {
      text-align: center;
      padding: 95px 0 80px;
    }

    .cta-box {
      border: 2.5px solid #ffffff;
      border-radius: 22px;
      background: var(--card);
      padding: 40px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .cta h2 {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .cta p {
      margin: 14px auto 26px;
      max-width: 520px;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.6;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .social {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1.5px solid #ffffff;
      background: rgba(255,255,255,.08);
      transition: .2s ease;
    }

    .social:hover {
      transform: translateY(-3px);
      background: #ffffff;
      color: #003D3D;
    }

    .social svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    footer {
      padding-bottom: 36px;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: .8rem;
    }

    @media (max-width: 850px) {
      .shorts {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .hero {
        padding: 50px 0 40px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .wrap {
        width: min(100% - 24px, 1180px);
      }

      .hero h1 {
        font-size: 1.5rem;
      }

      .cta {
        padding: 60px 0 45px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .btn,
      .card,
      .short,
      .social,
      .top-link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <a class="brand" href="#">
        <span class="brand-mark">T</span>
        <span>Tavvo</span>
      </a>

      <a class="top-link" href="#contact">DM me →</a>
    </header>

    <main>

      <section class="hero">
        <!-- Clean, exact slogan without extra text -->
        <h1>
          I help creators make clean, clear, easy-to-understand storytelling videos.
        </h1>

        <div class="hero-actions">
          <a class="btn btn-main" href="#work">See my work</a>
          <a class="btn btn-ghost" href="#contact">DM me</a>
        </div>
      </section>

      <section id="work">
        <div class="section-head">
          <h2>Showreel</h2>
        </div>

        <div class="featured">
          <iframe
            src="https://www.youtube.com/embed/OhPzcrFEsrE"
            title="Tavvo showreel"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>

          <div class="featured-label">
            A few of my editing skills as a montage.
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>Long form</h2>
        </div>

        <div class="grid">

          <article class="card">
            <iframe
              src="https://www.youtube.com/embed/-N7h4qDFeHc"
              title="Long form editing sample"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen>
            </iframe>
          </article>

          <!-- Add more long-form cards here -->

        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>Shorts</h2>
        </div>

        <div class="shorts">

          <article class="short">
            <iframe
              src="https://www.youtube.com/embed/Bul4-VK8HPI"
              title="Short editing sample"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen>
            </iframe>
          </article>

          <!-- Add more shorts here -->

        </div>
      </section>

      <section class="cta" id="contact">
        <div class="cta-box">
          <h2>Have a video to edit?</h2>

          <p>
            Send me a DM. Tell me what you're making and what you need.
          </p>

          <div class="socials">

            <a
              class="social"
              href="https://x.com/tavvoofficial"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="X">

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817-5.963 6.817H1.684l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/>
              </svg>
            </a>

            <!-- Updated Official Instagram Icon -->
            <a
              class="social"
              href="https://www.instagram.com/im_tavvo"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram">

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
              </svg>
            </a>

            <a
              class="social"
              href="https://discord.com/users/1483449584855285810"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Discord">

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.54 5.02A16.46 16.46 0 0 0 15.5 3.8l-.5.95a15.1 15.1 0 0 0-6 0l-.5-.95a16.5 16.5 0 0 0-4.04 1.22C2.1 8.14 1.4 11.17 1.75 14.16a16.4 16.4 0 0 0 4.96 2.53l1.2-1.63c-.66-.24-1.3-.53-1.9-.87l.46-.35c3.67 1.68 7.65 1.68 11.27 0l.47.35c-.6.34-1.24.63-1.91.87l1.2 1.63a16.4 16.4 0 0 0 4.96-2.53c.41-3.47-.7-6.47-2.92-9.14ZM8.57 13.1c-1.1 0-2-1-2-2.23 0-1.23.88-2.23 2-2.23s2 1 2 2.23c-.02 1.23-.9 2.23-2 2.23Zm6.86 0c-1.1 0-2-1-2-2.23 0-1.23.88-2.23 2-2.23s2 1 2 2.23c-.02 1.23-.9 2.23-2 2.23Z"/>
              </svg>
            </a>

          </div>
        </div>
      </section>

    </main>

    <footer>
      © <span id="year"></span> Tavvo
    </footer>

  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
