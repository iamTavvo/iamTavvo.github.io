<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tavvo – Video Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

        body {
      background: linear-gradient(var(--deg, 45deg), #00ffd5, #3bfff8, #94fff1);
      min-height: 100vh;
      color: var(--text);
      padding: 2.5rem 1rem;
      max-width: 820px;
      margin: 0 auto;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      border: 3px solid white;
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .tagline {
      font-size: 1.05rem;
      opacity: 0.9;
      max-width: 480px;
      margin: 0 auto 40px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 1.15rem;
      margin: 50px 0 18px;
      font-weight: 500;
    }

    /* Showreel */
    .showreel {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      aspect-ratio: 16/9;
    }

    .showreel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Horizontal rows */
    .scroll-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      overflow-x: auto;
      padding: 10px 5px 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-row::-webkit-scrollbar {
      height: 6px;
    }

    .scroll-row::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
    }

    .video-card {
      flex: 0 0 320px;
      scroll-snap-align: center;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .video-card iframe {
      width: 100%;
      height: 180px;
      border: none;
      display: block;
    }

    .video-card.short {
      flex: 0 0 160px;
    }

    .video-card.short iframe {
      height: 284px;
    }

    /* Contact */
    .contact {
      margin-top: 60px;
      padding-bottom: 40px;
    }

    .contact p {
      margin-bottom: 18px;
      font-size: 1rem;
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .icons a {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icons a:hover {
      background: rgba(255,255,255,0.25);
    }

    .icons img {
      width: 24px;
      height: 24px;
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      .video-card {
        flex: 0 0 280px;
      }
      .video-card.short {
        flex: 0 0 140px;
      }
      .video-card.short iframe {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo">Tavvo</div>

    <h1>Hi, My name is Tavvo</h1>
    <p class="tagline">"I help creators make clean, clear, easy-to-understand educational videos."</p>

    <!-- Showreel -->
    <div class="section-title">Showreel 👇</div>
    <div class="showreel">
      <iframe src="https://www.youtube.com/embed/OhPzcrFEsrE" allowfullscreen></iframe>
    </div>

    <!-- Long Form -->
    <div class="section-title">Long Form 👇</div>
    <div class="scroll-row">
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/-N7h4qDFeHc" allowfullscreen></iframe>
      </div>
      <!-- Add more long-form videos here later -->
    </div>

    <!-- Shorts -->
    <div class="section-title">Short Samples 👇</div>
    <div class="scroll-row">
      <div class="video-card short">
        <iframe src="https://www.youtube.com/embed/Bul4-VK8HPI" allowfullscreen></iframe>
      </div>
      <!-- Add more shorts here later -->
    </div>

    <!-- Contact -->
    <div class="contact">
      <p>Click below to DM me 👇</p>
      <div class="icons">
        <a href="https://x.com/tavvoofficial" target="_blank" title="X">
          <img src="https://cdn.simpleicons.org/x/white" alt="X">
        </a>
        <a href="https://www.instagram.com/im_tavvo" target="_blank" title="Instagram">
          <img src="https://cdn.simpleicons.org/instagram/white" alt="Instagram">
        </a>
        <a href="https://discord.com/users/1483449584855285810" target="_blank" title="Discord">
          <img src="https://cdn.simpleicons.org/discord/white" alt="Discord">
        </a>
      </div>
    </div>

    <footer>© Tavvo. All rights reserved.</footer>

  </div>
</body>
</html>
